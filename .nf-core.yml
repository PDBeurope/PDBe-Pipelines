    - assets/nf-core-pdbe_sifts_logo_light.png
    - docs/images/nf-core-pdbe_sifts_logo_light.png
    - docs/images/nf-core-pdbe_sifts_logo_dark.png
    - .github/ISSUE_TEMPLATE/config.yml
    - .github/workflows/awstest.yml
    - .github/workflows/awsfulltest.yml
    - conf/igenomes.config
    - conf/igenomes_ignored.config
    - assets/email_template.html
    - assets/sendmail_template.txt
    - assets/email_template.txt
    - assets/multiqc_config.yml
    - .github/ISSUE_TEMPLATE/bug_report.yml
    - .github/ISSUE_TEMPLATE/feature_request.yml
    - .github/PULL_REQUEST_TEMPLATE.md
    - .github/CONTRIBUTING.md
    - .github/.dockstore.yml
  readme:
    - nextflow_badge

template:
  org: PDBEurope
  name: pdbe_sifts
  description: pdbe sifts pipeline
  author: us
  version: 1.0.0dev
  force: true
  outdir: /Users/adamb/Documents/PDBe-Pipelines/
  skip_features:
    - github
    - igenomes
    - multiqc
    - fastqc
    - gpu
    - codespaces
    - vscode
    - email
    - adaptivecard
    - slackreport
  is_nfcore: false
